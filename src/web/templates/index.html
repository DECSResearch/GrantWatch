<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrantWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f7f8f6;
    --well: #ffffff;
    --ink: #15221c;
    --mist: #5b6660;
    --fog: #d6dbd7;
    --line: #858f8a;
    --spruce: #1e5a44;
    --spruce-soft: #dfeae4;
    --signal: #b3261e;
    --ochre: #8a5a00;
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1613;
      --well: #16201b;
      --ink: #e6eae7;
      --mist: #97a39d;
      --fog: #2a3630;
      --line: #66736d;
      --spruce: #6fbf9a;
      --spruce-soft: #1c2f27;
      --signal: #f08a7e;
      --ochre: #e0b45e;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }
  [hidden] { display: none !important; }
  a { color: var(--spruce); }
  :focus-visible { outline: 2px solid var(--spruce); outline-offset: 2px; }
  .page { max-width: 1040px; margin: 0 auto; padding: 36px 20px 72px; }

  header h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .status { margin: 4px 0 0; color: var(--mist); font-size: 15px; }
  .profile-line { margin: 14px 0 0; max-width: 72ch; }
  .notice { margin: 14px 0 0; padding: 12px 14px; border-left: 3px solid var(--ochre); background: var(--well); font-size: 15px; }
  .notice p { margin: 0; }
  .notice p + p { margin-top: 6px; }
  .notice code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }

  /* Horizon strip */
  .horizon { margin-top: 34px; }
  .horizon-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .horizon-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .horizon-head span { color: var(--mist); font-size: 14px; }
  .strip { position: relative; height: 72px; margin-top: 10px; border-bottom: 1px solid var(--ink); }
  .strip .tick { position: absolute; bottom: 0; width: 1px; height: 8px; background: var(--ink); }
  .strip .tick-label { position: absolute; top: calc(100% + 6px); transform: translateX(-50%); font-size: 12px; color: var(--mist); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .strip .tick-label.first { transform: none; }
  .strip .tick-label.last { transform: translateX(-100%); }
  .strip .band { position: absolute; bottom: 0; top: 0; background: var(--spruce-soft); opacity: 0.55; }
  .marker { position: absolute; bottom: 0; width: var(--hit); margin-left: calc(var(--hit) / -2); background: none; border: 0; padding: 0; cursor: pointer; }
  .marker::before { content: ""; position: absolute; bottom: 0; left: 50%; width: 6px; height: var(--bar); margin-left: -3px; background: var(--spruce); border-radius: 1px 1px 0 0; }
  .marker.forecast::before { background: transparent; border: 1.5px solid var(--spruce); border-bottom: 0; }
  .marker.watched::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--bar) + 3px); width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ochre); }
  .marker:hover::before, .marker:focus-visible::before { background: var(--ochre); border-color: var(--ochre); }
  .strip-axis { height: 22px; }
  .strip-empty { position: absolute; left: 0; right: 0; top: 24px; text-align: center; color: var(--mist); font-size: 14px; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin-top: 30px; padding-bottom: 14px; border-bottom: 1px solid var(--fog); }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mist); }
  .filters .check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 8px; color: var(--ink); font-size: 14px; }
  .filters input[type="search"], .filters select {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--well);
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 150px;
  }
  .filters input[type="search"] { min-width: 240px; }
  .filters input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--spruce); margin: 0; }
  .clear { background: none; border: 0; padding: 0 0 8px; color: var(--spruce); font: inherit; font-size: 14px; cursor: pointer; }
  .days.today b { font-size: 15px; }
  .count { margin-left: auto; color: var(--mist); font-size: 14px; padding-bottom: 8px; font-variant-numeric: tabular-nums; }

  /* Groups and rows */
  .group { margin-top: 30px; }
  .group h2 { font-size: 17px; font-weight: 600; color: var(--spruce); margin: 0 0 4px; }
  .group h2 span { color: var(--mist); font-weight: 400; }
  .row {
    display: grid; grid-template-columns: 76px 1fr 120px 96px; gap: 8px 16px; align-items: start;
    padding: 14px 0; border-top: 1px solid var(--fog);
  }
  .row:last-child { border-bottom: 1px solid var(--fog); }
  .row.flash { background: var(--spruce-soft); }
  @media (prefers-reduced-motion: no-preference) { .row { transition: background 600ms ease; } }
  .days { font-variant-numeric: tabular-nums; line-height: 1.15; padding-top: 2px; }
  .days b { display: block; font-size: 20px; font-weight: 600; }
  .days small { font-size: 12px; color: var(--mist); }
  .days.urgent b { color: var(--signal); }
  .days.soon b { color: var(--ochre); }
  .days.none b { color: var(--mist); font-weight: 400; font-size: 15px; }
  .main { min-width: 0; }
  .title { font-size: 16px; font-weight: 600; margin: 0; }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { color: var(--spruce); text-decoration: underline; }
  .meta { margin: 2px 0 0; font-size: 14px; color: var(--mist); }
  .why { margin: 6px 0 0; font-size: 14px; max-width: 78ch; }
  .why.summary { color: var(--mist); }
  .links { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 4px; }
  .more { background: none; border: 0; padding: 2px 0; color: var(--spruce); font: inherit; font-size: 13px; cursor: pointer; }
  .detail { margin-top: 10px; padding: 12px 14px; background: var(--well); border: 1px solid var(--fog); border-radius: 4px; font-size: 14px; max-width: 78ch; }
  .detail dl { margin: 0 0 10px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  .detail dt { color: var(--mist); }
  .detail dd { margin: 0; }
  .detail p { margin: 0; white-space: pre-line; }
  .score { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; font-size: 12px; color: var(--mist); font-variant-numeric: tabular-nums; }
  .squares { display: flex; gap: 3px; }
  .squares i { display: block; width: 10px; height: 10px; background: var(--fog); border-radius: 1px; }
  .squares i.on { background: var(--spruce); }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions button { font: inherit; font-size: 13px; padding: 6px 0; width: 100%; border-radius: 4px; background: transparent; cursor: pointer; }
  .track { font-weight: 600; border: 1px solid var(--spruce); color: var(--spruce); }
  .track.on { background: var(--spruce); color: var(--paper); }
  .vote { border: 1px solid var(--line); color: var(--ink); }
  .vote[aria-pressed="true"] { font-weight: 600; background: var(--spruce-soft); border-color: var(--spruce); color: var(--spruce); }
  .vote.no[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
  .track:disabled { opacity: 0.6; cursor: wait; }
  .public .row { grid-template-columns: 76px 1fr; }
  .empty, .error { margin-top: 30px; padding: 26px 0; border-top: 1px solid var(--fog); border-bottom: 1px solid var(--fog); color: var(--mist); }
  .error { color: var(--signal); }

  /* Team sign-in */
  .account { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: end; margin: 14px 0 0; font-size: 14px; color: var(--mist); }
  .account form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .account label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .account input { font: inherit; font-size: 15px; color: var(--ink); background: var(--well); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; min-width: 220px; }
  .account button { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border: 0; border-radius: 4px; background: var(--spruce); color: var(--paper); cursor: pointer; }
  .account button.link { background: none; color: var(--spruce); padding: 0; font-weight: 400; text-decoration: underline; }
  .account button:disabled { opacity: 0.6; cursor: wait; }
  .account .hint { flex-basis: 100%; margin: 0; font-size: 13px; }
  /* My profile panel (built by the script, for a member only) */
  .panel { margin: 14px 0 0; padding: 14px 0; max-width: 78ch; border-top: 1px solid var(--fog); border-bottom: 1px solid var(--fog); }
  .panel h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .panel label { display: block; font-size: 14px; font-weight: 600; }
  .panel .help { margin: 2px 0 8px; font-size: 14px; color: var(--mist); }
  .panel textarea { display: block; width: 100%; min-height: 120px; font: inherit; font-size: 15px; color: var(--ink); background: var(--well); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; resize: vertical; }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 10px; }
  .panel button { font: inherit; font-size: 14px; cursor: pointer; }
  .panel button[type="submit"] { font-weight: 600; padding: 7px 18px; border: 0; border-radius: 4px; background: var(--spruce); color: var(--paper); }
  .panel button.link { background: none; border: 0; padding: 0; color: var(--spruce); text-decoration: underline; }
  .panel button:disabled { opacity: 0.6; cursor: wait; }
  .panel .meta { margin-top: 10px; }
  .feedback { min-height: 22px; margin: 0; font-size: 14px; color: var(--mist); flex-basis: 100%; }
  .feedback.ok { color: var(--spruce); }
  .feedback.bad { color: var(--signal); }

  .foot { margin-top: 48px; font-size: 13px; }
  .foot a { color: var(--mist); }

  @media (max-width: 640px) {
    .page { padding: 24px 16px 56px; }
    .row, .public .row { grid-template-columns: 64px 1fr; }
    .score { grid-column: 2; flex-direction: row; align-items: center; gap: 8px; padding-top: 0; }
    .actions { grid-column: 2; flex-direction: row; flex-wrap: wrap; justify-self: start; }
    .actions button { width: auto; padding: 6px 14px; }
    .filters .search { flex: 1 1 100%; }
    .filters input[type="search"] { min-width: 100%; }
    .strip .tick-label.first { display: none; }
    .count { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>GrantWatch</h1>
    <p class="status" id="status">Loading…</p>
    <p class="profile-line" id="profileLine" hidden></p>
    <div class="notice" id="notice" hidden></div>
    <div class="account" id="account" hidden>
      <span id="accountText"></span>
      <button type="button" class="link" id="myProfile" aria-expanded="false" hidden>My profile</button>
      <button type="button" class="link" id="logout" hidden>Sign out</button>
      <form id="loginForm" hidden>
        <label>Team email <input type="email" id="loginEmail" required placeholder="you@und.edu" autocomplete="email"></label>
        <button type="submit" id="loginSubmit">Email me a sign-in link</button>
      </form>
      <p class="hint" id="signInHelp" hidden></p>
      <p class="feedback" id="loginFeedback" role="status" aria-live="polite"></p>
    </div>
  </header>

  <section class="horizon" id="horizon" aria-labelledby="horizonTitle">
    <div class="horizon-head">
      <h2 id="horizonTitle">Deadlines ahead</h2>
      <span id="horizonHint">Each bar is a grant's deadline. Hollow bars are estimated dates.</span>
    </div>
    <div class="strip" id="strip" role="group" aria-label="Timeline of upcoming deadlines"></div>
    <div class="strip-axis"></div>
  </section>

  <section class="filters" id="filters" aria-label="Filters">
    <label class="search">Search
      <input type="search" id="q" placeholder="Title, agency, or number" autocomplete="off">
    </label>
    <label id="minScoreLabel" hidden>Relevance at least
      <select id="minScore"></select>
    </label>
    <label>Closing within
      <select id="closingWithin"></select>
    </label>
    <label>Stage
      <select id="stage">
        <option value="">Any</option>
        <option value="concept">Concept or letter of intent</option>
        <option value="full">Full proposal</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="forecasted" checked> Show forecasted</label>
    <label class="check" id="watchedLabel" hidden><input type="checkbox" id="watchedOnly"> Only tracked</label>
    <label class="check" id="hiddenLabel" hidden><input type="checkbox" id="showHidden"> <span id="hiddenText">Show hidden</span></label>
    <button type="button" class="clear" id="clear">Reset filters</button>
    <span class="count" id="count" role="status" aria-live="polite"></span>
  </section>

  <div id="results"></div>

  <footer class="foot" id="foot" hidden><a href="/admin/">Admin</a></footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const els = {
    status: $("status"), profileLine: $("profileLine"), notice: $("notice"), strip: $("strip"), horizon: $("horizon"),
    horizonHint: $("horizonHint"), filters: $("filters"), q: $("q"), minScore: $("minScore"), minScoreLabel: $("minScoreLabel"),
    closingWithin: $("closingWithin"), forecasted: $("forecasted"), watchedOnly: $("watchedOnly"), watchedLabel: $("watchedLabel"),
    showHidden: $("showHidden"), hiddenLabel: $("hiddenLabel"), hiddenText: $("hiddenText"),
    stage: $("stage"), clear: $("clear"), count: $("count"), results: $("results"), foot: $("foot"),
    account: $("account"), accountText: $("accountText"), myProfile: $("myProfile"), logout: $("logout"),
    loginForm: $("loginForm"), loginEmail: $("loginEmail"), loginSubmit: $("loginSubmit"), loginFeedback: $("loginFeedback"), signInHelp: $("signInHelp"),
  };

  // BEGIN view rules
  // What the page shows follows from two answers: /api/session (who is looking) and /api/profile (what there is to
  // show them). This block holds those rules and the HTML of a row. It reads neither the page nor `state`, only its
  // arguments, so tests/test_dashboard_view.py runs it under node.
  // The markup is the public page. A member's parts are added to it, and only when `viewOf` says the viewer is one.

  const LIMIT = 500;

  const fmtDate = (iso) => {
    if (!iso) return "no date";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  };
  const fmtNum = (n) => Number(n).toLocaleString();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const link = (label, url) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label));
  // Grants.gov fills a missing close date with one far in the future; the API marks it not firm.
  const placeholderDate = (g) => Boolean(g.close_date) && g.firm_deadline === false;
  // The line over the list. `total` counts postings, but the list folds one program's postings into a row and
  // leaves out the ones marked Not for us, so when the limit cuts it short this says how many rows are drawn.
  const countLine = (drawn, total) => total > LIMIT
    ? `Showing ${plural(drawn, "grant")} from the first ${LIMIT} of ${total} postings. Narrow the filters to see the rest.`
    : plural(drawn, "grant");

  const TEXT = {
    publicAccount: "A public list of open Grants.gov grants. Team members sign in for fit scores, tracking and email.",
    signInHelp: "Link not arriving? Ask the GrantWatch admin for one.",
    publicStrip: "Each bar is a grant's deadline. Hollow bars are estimated dates.",
    memberStrip: "Each bar is a grant; taller means a better fit. Hollow bars are estimated dates.",
    publicEmpty: "Nothing matches. Widen the closing window or clear the search.",
    memberEmpty: "Nothing matches. Widen the closing window, lower the relevance bar, or clear the search.",
    scoringOff: "Relevance scoring is off. Fill in the summary in <code>config/research_profile.yml</code> and set a model to see fit scores and reasons.",
    ownPending: "Your own matches start after the next daily run. Until then you see the team's.",
    profileHelp: "Two to five sentences on your topics, methods and the kinds of programs you would apply to. GrantWatch scores grants against this for you instead of the team profile.",
    resetConfirm: "Saving a changed profile deletes the scores stored for the old one. You will see the team's scores until the next daily run scores the new one. Save it?",
    teamConfirm: "Use the team profile instead? Your own profile and its scores are deleted, and your Relevant and Not for us marks count for the team again.",
    signedOut: "You are signed out. Reload the page to sign in again.",
  };

  // The score bar a list opens on. It means something once there is a profile or there are scores, and a visitor has none.
  // A member's is their own (`me.min_score`: what they set for their email, else the team's, which the server works out),
  // and it is the one `data.fit_count` is counted at.
  function defaultFloor(p, member) {
    if (!member) return 0;
    const scored = (p.data && p.data.scored) || 0;
    if (!p.configured && scored === 0) return 0;
    return (p.me && p.me.min_score) ?? p.min_score ?? 4;
  }

  function publicStatus(p) {
    const d = p.data;
    if (!d) return "Database unavailable.";
    if (!p.configured) return "";  // no list to describe
    return d.data_as_of ? `Open Grants.gov opportunities as of ${fmtDate(d.data_as_of)}: ${fmtNum(d.open)}.` : "No pipeline run recorded yet.";
  }

  // `scored` is how many open grants have a score in the list: the team's, or the member's own when they are shown those.
  function memberStatus(p, floor, scored) {
    const d = p.data;
    if (!d) return "Database unavailable.";
    if (!d.data_as_of) return "No pipeline run recorded yet.";
    const fit = scored > 0 && floor > 0 && d.fit_count != null ? ` ${d.fit_count} score ${floor} or higher.` : "";
    return `Data as of ${fmtDate(d.data_as_of)}. ${plural(d.open, "open grant")}, ${scored} scored, ${d.watched} tracked.${fit}`;
  }

  // Everything that depends on who is looking, from the session and the profile answers (either may be missing).
  // For a visitor `profile.configured` says there is a list to show (a model is on and the team profile is set);
  // for a member it says only that the team profile is set.
  function viewOf(session, profile) {
    const s = session || {};
    const p = profile || {};
    const member = Boolean(s.email);
    const signIn = Boolean(s.auth_configured);
    const me = member && p.me ? p.me : null;
    const personal = Boolean(me && me.has_profile);
    // Their own scores once any are stored, the team's before that (`me.using`, which the list answers by too).
    const mine = personal && me.using === "mine";
    const floor = defaultFloor(p, member);
    const teamScored = (p.data && p.data.scored) || 0;
    const shownScored = mine && me.coverage ? me.coverage.scored : teamScored;
    const teamLine = p.configured && p.summary ? `Scored for: ${p.summary}${p.summary.endsWith(".") ? "" : "."}` : "";
    const notices = [];
    // The team profile is what scoring needs, so a member's own scores still to come do not turn this note on.
    if (member && !p.configured && teamScored === 0) notices.push(TEXT.scoringOff);
    if (personal && !mine) notices.push(TEXT.ownPending);
    return {
      member,
      signIn,
      personal,
      mine,
      list: member || p.configured === true,
      floor,
      status: member ? memberStatus(p, floor, shownScored) : publicStatus(p),
      profileLine: !member ? "" : mine ? `Scored for your own profile${me.updated_at ? `, updated ${fmtDate(me.updated_at)}` : ""}.` : teamLine,
      notices,
      accountText: member ? `Signed in as ${s.email}.` : signIn ? TEXT.publicAccount : "",
      signInHelp: !member && signIn ? TEXT.signInHelp : "",
      stripHint: member ? TEXT.memberStrip : TEXT.publicStrip,
      emptyText: member ? TEXT.memberEmpty : TEXT.publicEmpty,
    };
  }

  // The query a list asks for. A visitor's has no score bar and no tracked-only: the server ignores both for them,
  // so the page does not send them.
  function paramsFor(v, view) {
    const q = new URLSearchParams();
    if (v.q.trim()) q.set("q", v.q.trim());
    if (view.member && Number(v.minScore) > 0) q.set("min_score", v.minScore);
    if (v.closingWithin) q.set("closing_within", v.closingWithin);
    if (v.stage) q.set("stage", v.stage);
    q.set("include_forecasted", v.forecasted ? "true" : "false");
    if (view.member && v.watchedOnly) q.set("watched_only", "true");
    q.set("limit", String(LIMIT));
    return q;
  }

  // How tall a deadline's bar is: a better fit is taller, and a visitor's bars are all one height.
  function barHeight(g, view) {
    const s = view.member ? g.relevance_score : null;
    return s === null || s === undefined ? 12 : 12 + s * 10;
  }

  function daysCell(g) {
    if (g.days_left === null || g.days_left === undefined) return `<div class="days none"><b>none</b></div>`;
    if (g.days_left === 0) return `<div class="days urgent today"><b>today</b><small>closes${g.forecasted ? ", est." : ""}</small></div>`;
    const cls = g.days_left <= 7 ? "urgent" : g.days_left <= 30 ? "soon" : "";
    const word = g.days_left === 1 ? "day" : "days";
    return `<div class="days ${cls}"><b>${g.days_left}</b><small>${g.days_left < 0 ? "days ago" : word}${g.forecasted ? ", est." : ""}</small></div>`;
  }

  function scoreCell(g) {
    const s = g.relevance_score;
    const squares = [0, 1, 2, 3, 4].map((i) => `<i class="${s !== null && s !== undefined && i < s ? "on" : ""}"></i>`).join("");
    return `<div class="score"><div class="squares" aria-hidden="true">${squares}</div><span>${s === null || s === undefined ? "unscored" : `${s} of 5`}</span></div>`;
  }

  const voteLabel = (g, verdict) => {
    const n = verdict > 0 ? g.votes_up : g.votes_down;
    return `${verdict > 0 ? "Relevant" : "Not for us"}${n ? ` ${n}` : ""}`;
  };

  function actionsHtml(g) {
    const describe = `aria-describedby="title-${g.idx}"`;
    const vote = (verdict) => `<button type="button" class="vote ${verdict > 0 ? "yes" : "no"}" data-vote="${verdict}" aria-pressed="${g.my_verdict === verdict}" ${describe}>${esc(voteLabel(g, verdict))}</button>`;
    return `<div class="actions">
        <button type="button" class="track ${g.watched ? "on" : ""}" data-track="${esc(g.opp_id)}" aria-pressed="${g.watched ? "true" : "false"}" ${describe}>${g.watched ? "Tracked" : "Track"}</button>
        ${vote(1)}${vote(-1)}
      </div>`;
  }

  // A visitor's row is two columns: when it closes, and the grant with Grants.gov's description. A member's adds the
  // score and the buttons. Which it is comes from `view` alone, so a row that holds more than a visitor may see
  // still draws no reason, score or mark.
  function rowHtml(g, view) {
    const i = g.idx;
    const describe = `aria-describedby="title-${i}"`;
    const meta = [g.agency || "Unknown agency"];
    if (g.close_date) meta.push(placeholderDate(g) ? "no firm deadline" : `closes ${fmtDate(g.close_date)}${g.forecasted ? " (estimated)" : ""}`);
    if (g.award_ceiling) meta.push(`up to $${Number(g.award_ceiling).toLocaleString()}`);
    const also = g.also_posted && g.also_posted.length
      ? `<p class="meta">Also posted by: ${g.also_posted.map((a) => link(a.agency || a.opp_id, a.url)).join(", ")}</p>` : "";
    const newer = g.superseded_by ? `<p class="meta">A newer solicitation exists: ${link(g.superseded_by.opp_id, g.superseded_by.url)}</p>` : "";
    const why = view.member && g.relevance_reason ? `<p class="why">${esc(g.relevance_reason)}</p>` : g.summary ? `<p class="why summary">${esc(g.summary)}</p>` : "";
    const title = g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>` : esc(g.title);
    const grantsGov = g.url ? `<a class="more" href="${esc(g.url)}" target="_blank" rel="noopener" ${describe}>Grants.gov</a>` : "";
    return `<article class="row" id="row-${i}" data-idx="${i}" data-id="${esc(g.opp_id)}" tabindex="-1">
      ${daysCell(g)}
      <div class="main">
        <h3 class="title" id="title-${i}">${title}</h3>
        <p class="meta">${esc(meta.join(", "))}</p>
        ${also}${newer}${why}
        <div class="links">
          <button type="button" class="more" data-more="${esc(g.opp_id)}" aria-expanded="false" ${describe}>Details</button>
          ${grantsGov}
        </div>
        <div class="detail" data-detail="${esc(g.opp_id)}" hidden></div>
      </div>
      ${view.member ? scoreCell(g) + actionsHtml(g) : ""}
    </article>`;
  }

  // --- The My profile panel ---

  // Whitespace folded as the server folds it (it also drops control characters), so a text that differs only in spacing is no change.
  const norm = (text) => String(text ?? "").replace(/\s+/g, " ").trim();

  // What saving `typed` would do. It is a change unless it matches the profile as stored; a change deletes the member's
  // scores, which exist while they are shown their own (`me.using`), so that is when to ask first. A first profile has none.
  function planSave(me, stored, typed) {
    const changed = !(stored && stored.has_profile) || norm(typed) !== norm(stored.summary);
    const deletesScores = Boolean(me && me.has_profile && me.using === "mine");
    return { changed, confirm: changed && deletesScores ? TEXT.resetConfirm : null };
  }

  // "412 of 1,371 open grants scored for your profile. The rest are scored in the daily run." (nothing without a profile)
  function coverageLine(me) {
    if (!me || !me.has_profile || !me.coverage) return "";
    const { open, scored } = me.coverage;
    return `${fmtNum(scored)} of ${fmtNum(open)} open grants scored for your profile.${scored < open ? " The rest are scored in the daily run." : ""}`;
  }

  // What to tell the person when the server refused or failed: its own words for a profile it cannot store (400).
  function profileProblem(status, body) {
    if (status === 400 && body && typeof body.detail === "string") return body.detail;
    if (status === 401 || status === 503) return TEXT.signedOut;
    return `Couldn't update your profile: HTTP ${status}.`;
  }

  // The panel's HTML, for a member only: a visitor gets an empty string, and the page's markup holds none of it.
  // The textarea is filled with `.value` once the stored text is in, never as HTML.
  function panelHtml(view, me) {
    if (!view.member) return "";
    const line = coverageLine(me);
    return `<section class="panel" id="profilePanel" aria-labelledby="panelTitle">
      <h2 id="panelTitle">My profile</h2>
      <form id="profileForm">
        <label for="profileText">What you work on</label>
        <p class="help" id="profileHelp">${esc(TEXT.profileHelp)}</p>
        <textarea id="profileText" rows="6" aria-describedby="profileHelp" required></textarea>
        <div class="panel-actions">
          <button type="submit" id="profileSave">Save</button>
          <button type="button" class="link" id="profileTeam"${view.personal ? "" : " hidden"}>Use the team profile instead</button>
        </div>
        <p class="feedback" id="profileFeedback" role="status" aria-live="polite"></p>
      </form>
      <p class="meta" id="profileCoverage"${line ? "" : " hidden"}>${esc(line)}</p>
    </section>`;
  }

  // Whether a row is left out of the list until asked for: the team's Not for us for a member on the team profile, and
  // their own for one with a profile of their own (their vote decides for them alone), unless the grant is tracked.
  // `with_feedback` in grants/feedback.py says the same on the server, and the tests hold the two together.
  const hiddenFor = (g, personal) => (personal ? g.my_verdict === -1 : (g.team_verdict || 0) < 0) && !g.watched;

  // The row after the member's vote (null takes it back), as the server would send it. The team's counts and verdict move
  // only when they are sent: a member with a profile of their own is sent none.
  function applyVote(g, verdict, personal) {
    if (g.votes_up != null && g.votes_down != null) {
      g.votes_up += (verdict === 1) - (g.my_verdict === 1);
      g.votes_down += (verdict === -1) - (g.my_verdict === -1);
      g.team_verdict = Math.sign(g.votes_up - g.votes_down);
    }
    g.my_verdict = verdict;
    g.hidden = hiddenFor(g, personal);
  }

  // The label and value pairs of a grant's details, those with a value. A visitor's leave out the keywords and the scorer.
  function detailRows(g, view) {
    const rows = [
      ["Opportunity", g.opp_id], ["Status", g.opportunity_status], ["Posted", fmtDate(g.post_date)],
      ["Closes", g.close_date ? (placeholderDate(g) ? "no firm deadline" : fmtDate(g.close_date)) : "no date"], ["Categories", g.funding_categories],
      ["Award ceiling", g.award_ceiling ? `$${Number(g.award_ceiling).toLocaleString()}` : ""],
      ["Program funding", g.estimated_total_funding ? `$${Number(g.estimated_total_funding).toLocaleString()}` : ""],
    ];
    if (view.member) rows.push(["Matched keywords", g.matched_keywords], ["Scored by", g.relevance_model]);
    return rows.filter(([, v]) => v);
  }
  // END view rules

  const state = { profile: null, horizons: [7, 30, 60, 90], grants: [], total: 0, busy: false, session: { auth_configured: false, email: null }, view: viewOf(null, null) };

  // Grants the team marked Not for us stay out of the list unless asked for.
  const visible = () => (els.showHidden.checked ? state.grants : state.grants.filter((g) => !g.hidden));

  function fillSelect(select, options, value) {
    select.innerHTML = options.map((o) => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
    select.value = String(value);
  }

  function setupFilters() {
    const p = state.profile || {};
    const threshold = state.view.floor;
    // The floor can be any of 0 to 5; it must be a choice, or Reset filters could not restore it.
    const scoreOptions = [...new Set([0, 3, 4, 5, threshold])].sort((a, b) => a - b).map((v) => ({ value: v, label: v === 0 ? "Any" : `${v} of 5` }));
    fillSelect(els.minScore, scoreOptions, threshold);
    const windows = [{ value: "", label: "Any date" }];
    [...new Set([...state.horizons, 180])].sort((a, b) => a - b).forEach((d) => windows.push({ value: d, label: `${d} days` }));
    fillSelect(els.closingWithin, windows, "");
    els.forecasted.checked = p.include_forecasted !== false;
    els.watchedOnly.checked = false;
    els.showHidden.checked = false;
    els.stage.value = "";
    els.q.value = "";
  }

  async function loadProfile() {
    try {
      const res = await fetch("/api/profile", { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.profile = await res.json();
    } catch (err) {
      state.profile = state.profile || { configured: false };  // asked again after a change: keep what is known
    }
    if (Array.isArray(state.profile.horizons) && state.profile.horizons.length) state.horizons = state.profile.horizons.map(Number);
  }

  // What is on the page that depends on who is looking, once the session and the profile are both in. The markup
  // is the visitor's page (a member's controls start hidden); this adds a member's parts and leaves out the rest.
  function renderPage() {
    const v = state.view = viewOf(state.session, state.profile);
    els.status.textContent = v.status;
    els.status.hidden = !v.status;
    els.profileLine.textContent = v.profileLine;
    els.profileLine.hidden = !v.profileLine;
    els.notice.innerHTML = v.notices.map((html) => `<p>${html}</p>`).join("");
    els.notice.hidden = v.notices.length === 0;
    els.horizonHint.textContent = v.stripHint;
    els.horizon.hidden = els.filters.hidden = !v.list;
    els.minScoreLabel.hidden = els.watchedLabel.hidden = els.foot.hidden = !v.member;
    renderAccount();
  }

  function loadParams() {
    return paramsFor({
      q: els.q.value, minScore: els.minScore.value, closingWithin: els.closingWithin.value, stage: els.stage.value,
      forecasted: els.forecasted.checked, watchedOnly: els.watchedOnly.checked,
    }, state.view);
  }

  async function loadGrants() {
    if (!state.view.list) return;  // a visitor to a server with no list sees the sign-in prompt only
    els.count.textContent = "Loading…";
    try {
      const res = await fetch(`/api/grants?${loadParams()}`, { headers: { Accept: "application/json" } });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
      state.grants = body.results || [];
      state.grants.forEach((g, i) => { g.idx = i; });  // rows, titles and markers are named by this, not by the opportunity number
      state.total = Number(body.total ?? state.grants.length);
      render();
    } catch (err) {
      state.grants = [];
      state.total = 0;
      els.results.innerHTML = `<p class="error">Couldn't load grants: ${esc(err.message)}. The database may be offline.</p>`;
      els.count.textContent = "";
      renderHiddenToggle();
      renderStrip();
    }
  }

  function bucketOf(days) {
    if (days === null || days === undefined) return "none";
    if (days < 0) return "closed";
    for (const h of state.horizons) if (days <= h) return h;
    return "later";
  }

  function groups() {
    const map = new Map();
    for (const g of visible()) {
      const key = bucketOf(g.days_left);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(g);
    }
    const order = [...state.horizons, "later", "none", "closed"];
    let lower = 0;
    return order.filter((k) => map.has(k)).map((k) => {
      let label;
      if (typeof k === "number") {
        label = lower === 0 ? `Closes within ${k} days` : `Closes in ${lower + 1} to ${k} days`;
        lower = k;
      } else {
        label = { later: `Closes after ${state.horizons[state.horizons.length - 1]} days`, none: "No firm deadline", closed: "Already closed" }[k];
      }
      return { key: k, label, items: map.get(k) };
    });
  }

  function render() {
    const shown = visible();
    const gs = groups();
    els.results.classList.toggle("public", !state.view.member);
    els.count.textContent = countLine(shown.length, state.total);
    if (!shown.length) {
      els.results.innerHTML = state.grants.length
        ? `<p class="empty">Everything here was marked Not for us. Turn on Show hidden to see it.</p>`
        : `<p class="empty">${esc(state.view.emptyText)}</p>`;
    } else {
      els.results.innerHTML = gs.map((grp) => `<section class="group"><h2>${esc(grp.label)} <span>(${grp.items.length})</span></h2>${grp.items.map((g) => rowHtml(g, state.view)).join("")}</section>`).join("");
    }
    renderHiddenToggle();
    renderStrip();
  }

  function renderHiddenToggle() {
    const n = state.grants.filter((g) => g.hidden).length;
    els.hiddenLabel.hidden = n === 0 && !els.showHidden.checked;
    els.hiddenText.textContent = n ? `Show hidden (${n})` : "Show hidden";
  }

  // Markers get a 24px-wide hit box around their 6px bar. Several on one day are spread 8px apart so
  // none covers another; a crowd near the right edge spreads leftwards so it cannot widen the page.
  // A box never reaches past the midpoint to its neighbour, so each bar stays clickable.
  const HIT = 24, BAR = 6, STEP = 8, NARROW = 340, GUTTER = 12;

  function renderStrip() {
    const max = state.horizons[state.horizons.length - 1];
    const pct = (d) => Math.min(100, Math.max(0, (d / max) * 100));
    const ticks = [0, ...state.horizons].map((d, i, arr) => {
      const cls = i === 0 ? "first" : i === arr.length - 1 ? "last" : "";
      return `<span class="tick" style="left:${pct(d)}%"></span><span class="tick-label ${cls}" style="left:${pct(d)}%">${d === 0 ? "today" : `${d} days`}</span>`;
    }).join("");
    const first = state.horizons[0];
    const band = `<span class="band" style="left:0;width:${pct(first)}%"></span>`;
    const inRange = visible().filter((g) => g.days_left !== null && g.days_left !== undefined && g.days_left >= 0 && g.days_left <= max)
      .sort((a, b) => a.days_left - b.days_left);
    const placed = [];
    for (let start = 0; start < inRange.length;) {
      const day = inRange[start].days_left;
      let end = start;
      while (end < inRange.length && inRange[end].days_left === day) end++;
      const crowd = end - start;
      const dir = (crowd - 1) * STEP + STEP / 2 > ((max - day) / max) * NARROW + GUTTER ? -1 : 1;
      for (let k = 0; k < crowd; k++) placed.push({ g: inRange[start + k], pct: pct(day), off: dir * k * STEP });
      start = end;
    }
    placed.sort((a, b) => a.pct - b.pct || a.off - b.off);
    const gap = (a, b) => `calc(${b.pct - a.pct}% + ${b.off - a.off}px)`;
    const markers = placed.map((m, i) => {
      const g = m.g;
      const h = barHeight(g, state.view);
      const reach = [`${HIT}px`];
      if (i > 0) reach.push(gap(placed[i - 1], m));
      if (i < placed.length - 1) reach.push(gap(m, placed[i + 1]));
      const cls = `marker${g.forecasted ? " forecast" : ""}${g.watched ? " watched" : ""}`;
      const label = `${g.title} (${g.agency || "agency unknown"}), ${plural(g.days_left, "day")} left`;
      const style = `left:calc(${m.pct}% + ${m.off}px);height:${Math.max(h, HIT)}px;--bar:${h}px;--hit:max(${BAR}px, min(${reach.join(", ")}))`;
      return `<button type="button" class="${cls}" style="${style}" data-jump="${g.idx}" title="${esc(label)}" aria-label="${esc(label)}"></button>`;
    }).join("");
    const empty = inRange.length ? "" : `<span class="strip-empty">No deadlines in the next ${max} days for the current filters.</span>`;
    els.strip.innerHTML = band + ticks + markers + empty;
  }

  async function toggleTrack(button) {
    const id = button.dataset.track;
    const on = button.classList.contains("on");
    button.disabled = true;
    try {
      const res = on
        ? await fetch(`/api/watchlist/${encodeURIComponent(id)}`, { method: "DELETE" })
        : await fetch("/api/watchlist", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ opp_id: id }) });
      if (res.status === 401 || res.status === 503) {
        const body = await res.json().catch(() => ({}));
        askToSignIn(body.detail || "Sign in to track grants.");
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const g = state.grants.find((x) => x.opp_id === id);
      if (g) { g.watched = !on; g.hidden = hiddenFor(g, state.view.personal); }
      button.classList.toggle("on", !on);
      button.setAttribute("aria-pressed", String(!on));
      button.textContent = on ? "Track" : "Tracked";
      renderHiddenToggle();
      renderStrip();
    } catch (err) {
      button.textContent = "Try again";
    } finally {
      button.disabled = false;
    }
  }

  // Mark a grant Relevant or Not for us; the same button again takes the mark back.
  // A program's one vote sits on one of its postings, which may not be the one the row leads with.
  async function castVote(button) {
    const row = button.closest(".row");
    const g = row && state.grants[Number(row.dataset.idx)];
    if (!g || row.dataset.busy) return;
    const verdict = Number(button.dataset.vote);
    const clearing = g.my_verdict === verdict;
    const target = g.my_vote_opp_id || g.opp_id;
    row.dataset.busy = "1";
    try {
      const res = clearing
        ? await fetch(`/api/feedback/${encodeURIComponent(target)}`, { method: "DELETE" })
        : await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ opp_id: target, verdict }) });
      if (res.status === 401 || res.status === 503) {
        const body = await res.json().catch(() => ({}));
        askToSignIn(body.detail || "Sign in to mark grants.");
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      applyVote(g, clearing ? null : verdict, state.view.personal);
      g.my_vote_opp_id = clearing ? g.opp_id : target;
      row.querySelectorAll(".vote").forEach((b) => {
        const v = Number(b.dataset.vote);
        b.setAttribute("aria-pressed", String(g.my_verdict === v));
        b.textContent = voteLabel(g, v);
      });
      renderHiddenToggle();  // the row itself stays put, so the mark can be taken back; it goes at the next load
    } catch (err) {
      button.textContent = "Try again";
    } finally {
      delete row.dataset.busy;
    }
  }

  async function toggleDetail(button) {
    const id = button.dataset.more;
    const box = els.results.querySelector(`[data-detail="${CSS.escape(id)}"]`);
    if (!box) return;
    const open = !box.hidden;
    if (open) { box.hidden = true; button.setAttribute("aria-expanded", "false"); button.textContent = "Details"; return; }
    button.textContent = "Loading…";
    try {
      const res = await fetch(`/api/grants/${encodeURIComponent(id)}`, { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const g = await res.json();
      const rows = detailRows(g, state.view);
      box.innerHTML = `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl><p>${esc(g.description || "No description in the extract.")}</p>`;
      box.hidden = false;
      button.setAttribute("aria-expanded", "true");
      button.textContent = "Hide details";
    } catch (err) {
      box.innerHTML = `<p>Couldn't load details: ${esc(err.message)}</p>`;
      box.hidden = false;
      button.textContent = "Hide details";
    }
  }

  function jumpTo(idx) {
    const row = document.getElementById(`row-${idx}`);
    if (!row) return;
    row.scrollIntoView({ block: "center", behavior: "smooth" });
    row.focus({ preventScroll: true });  // so keyboard and screen-reader users land on the grant, not back on the strip
    row.classList.add("flash");
    setTimeout(() => row.classList.remove("flash"), 1400);
  }

  function renderAccount() {
    const v = state.view;
    els.account.hidden = !v.signIn;
    els.myProfile.hidden = els.logout.hidden = !v.member;
    els.loginForm.hidden = v.member;
    els.accountText.textContent = v.accountText;
    els.signInHelp.textContent = v.signInHelp;
    els.signInHelp.hidden = !v.signInHelp;
  }

  function askToSignIn(message) {
    els.loginFeedback.className = "feedback bad";
    els.loginFeedback.textContent = message;
    if (!els.loginForm.hidden) els.loginEmail.focus();
    els.account.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  async function loadSession() {
    try {
      const res = await fetch("/api/session", { headers: { Accept: "application/json" } });
      if (res.ok) state.session = await res.json();
    } catch (err) { /* a visitor without a session */ }
  }

  async function requestLink(event) {
    event.preventDefault();
    els.loginSubmit.disabled = true;
    els.loginFeedback.className = "feedback";
    els.loginFeedback.textContent = "Sending…";
    try {
      const res = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: els.loginEmail.value.trim() }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.status === 422) throw new Error("enter a valid email address.");
      if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `HTTP ${res.status}`);
      els.loginFeedback.className = "feedback ok";
      els.loginFeedback.textContent = body.detail;
    } catch (err) {
      els.loginFeedback.className = "feedback bad";
      els.loginFeedback.textContent = `Couldn't send a link: ${err.message}`;
    } finally {
      els.loginSubmit.disabled = false;
    }
  }

  // --- The My profile panel: built when a member opens it, and gone when they close it ---
  const panel = { el: null, stored: null };
  const inPanel = (id) => panel.el.querySelector(`#${id}`);

  function panelFeedback(text, kind) {
    if (!panel.el) return;  // closed while a request was out
    const f = inPanel("profileFeedback");
    f.className = kind ? `feedback ${kind}` : "feedback";
    f.textContent = text;
  }

  // The team button and the coverage line follow the profile, which changes under an open panel when it is saved or removed.
  function renderPanelParts() {
    if (!panel.el) return;
    const line = coverageLine(state.profile && state.profile.me);
    inPanel("profileTeam").hidden = !state.view.personal;
    inPanel("profileCoverage").textContent = line;
    inPanel("profileCoverage").hidden = !line;
  }

  function closePanel() {
    if (panel.el) panel.el.remove();
    panel.el = null;
    els.myProfile.setAttribute("aria-expanded", "false");
  }

  async function openPanel() {
    if (!state.view.member || panel.el) return;
    const holder = document.createElement("div");
    holder.innerHTML = panelHtml(state.view, state.profile && state.profile.me);
    panel.el = holder.firstElementChild;
    els.account.insertAdjacentElement("afterend", panel.el);
    els.myProfile.setAttribute("aria-expanded", "true");
    panel.el.addEventListener("submit", saveProfile);
    panel.el.addEventListener("keydown", (event) => { if (event.key === "Escape") { closePanel(); els.myProfile.focus(); } });
    inPanel("profileTeam").addEventListener("click", useTeamProfile);
    const text = inPanel("profileText");
    text.disabled = true;
    panelFeedback("Loading…", "");
    try {
      const res = await fetch("/api/me/profile", { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error(profileProblem(res.status, null));
      panel.stored = await res.json();
      text.value = panel.stored.summary || "";
      panelFeedback("", "");
    } catch (err) {
      panel.stored = null;
      panelFeedback(err.message, "bad");
    }
    text.disabled = false;
    text.focus();
  }

  // Everything the member sees depends on whose profile it is, so ask for the profile and the list again; the filters stay as set.
  async function refreshForProfile() {
    await loadProfile();
    renderPage();
    renderPanelParts();
    await loadGrants();
  }

  async function saveProfile(event) {
    event.preventDefault();
    const text = inPanel("profileText"), save = inPanel("profileSave");
    const plan = planSave(state.profile && state.profile.me, panel.stored, text.value);
    if (plan.confirm && !window.confirm(plan.confirm)) { panelFeedback("", ""); return; }  // nothing was saved, so no earlier "Saved." stands
    save.disabled = true;
    panelFeedback("Saving…", "");
    try {
      const res = await fetch("/api/me/profile", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ summary: text.value }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(profileProblem(res.status, body));
      panel.stored = body;
      text.value = body.summary || "";  // as it was stored, whitespace folded
      await refreshForProfile();
      panelFeedback("Saved.", "ok");
    } catch (err) {
      panelFeedback(err.message, "bad");
    } finally {
      save.disabled = false;
    }
  }

  async function useTeamProfile() {
    if (!window.confirm(TEXT.teamConfirm)) return;
    const button = inPanel("profileTeam");
    button.disabled = true;
    try {
      const res = await fetch("/api/me/profile", { method: "DELETE" });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(profileProblem(res.status, body));
      panel.stored = { has_profile: false, summary: null, updated_at: null };
      inPanel("profileText").value = "";
      await refreshForProfile();
      panelFeedback("You are using the team profile.", "ok");
    } catch (err) {
      panelFeedback(err.message, "bad");
    } finally {
      button.disabled = false;
    }
  }

  // Reload rather than redraw in place: the scores, marks and profile on screen were the member's own,
  // and a shared screen must not keep them.
  async function signOut() {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  }

  let timer = null;
  const debounced = () => { clearTimeout(timer); timer = setTimeout(loadGrants, 250); };
  els.q.addEventListener("input", debounced);
  [els.minScore, els.closingWithin, els.forecasted, els.watchedOnly, els.stage].forEach((el) => el.addEventListener("change", loadGrants));
  els.showHidden.addEventListener("change", render);
  els.clear.addEventListener("click", () => { setupFilters(); loadGrants(); });
  els.results.addEventListener("click", (event) => {
    const track = event.target.closest("[data-track]");
    if (track) return toggleTrack(track);
    const vote = event.target.closest("[data-vote]");
    if (vote) return castVote(vote);
    const more = event.target.closest("[data-more]");
    if (more) return toggleDetail(more);
  });
  els.strip.addEventListener("click", (event) => {
    const marker = event.target.closest("[data-jump]");
    if (marker) jumpTo(marker.dataset.jump);
  });
  els.loginForm.addEventListener("submit", requestLink);
  els.logout.addEventListener("click", signOut);
  els.myProfile.addEventListener("click", () => (panel.el ? closePanel() : openPanel()));

  // The page is drawn once it knows who is looking, so a visitor never sees a member's controls and the buttons are right the first time.
  Promise.all([loadSession(), loadProfile()]).then(() => { renderPage(); setupFilters(); return loadGrants(); });
})();
</script>
</body>
</html>
