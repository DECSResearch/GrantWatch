name: Daily grants pipeline

on:
  schedule:
    # Grants.gov publishes the daily extract around 04:00 ET; 12:00 UTC gives
    # it a comfortable margin to land before we fetch it.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: grants-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTS_DATA_SOURCE: extract
      # Required: the production Postgres DSN (Neon). Whitespace is stripped by the app.
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      # Optional: contents of the Gmail OAuth token.json; without it the run
      # still filters and loads grants but skips the email.
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      # Relevance scoring needs an OpenAI-compatible server the runner can reach.
      # A model on a laptop is not reachable from GitHub; for Ollama or vLLM at
      # home, schedule scripts/run_daily.sh locally instead (see README).
      GRANTS_LLM_BASE_URL: ${{ secrets.GRANTS_LLM_BASE_URL }}
      GRANTS_LLM_API_KEY: ${{ secrets.GRANTS_LLM_API_KEY }}
      GRANTS_LLM_MODEL: ${{ vars.GRANTS_LLM_MODEL }}
      # Optional tuning via repository variables (empty means "use the profile").
      GRANTS_MIN_SCORE: ${{ vars.GRANTS_MIN_SCORE }}
      GRANTS_KEYWORDS: ${{ vars.GRANTS_KEYWORDS }}
      GRANTS_INCLUDE_FORECAST: ${{ vars.GRANTS_INCLUDE_FORECAST }}
      GRANTS_GOV_LOOKBACK_DAYS: ${{ vars.GRANTS_GOV_LOOKBACK_DAYS }}
      GMAIL_NOTIFY_RECIPIENTS: ${{ vars.GMAIL_NOTIFY_RECIPIENTS }}
      GMAIL_SENDER_EMAIL: ${{ vars.GMAIL_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "::error::POSTGRES_URL secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail token
        if: env.GMAIL_TOKEN_JSON != ''
        run: |
          printf '%s' "$GMAIL_TOKEN_JSON" > "$RUNNER_TEMP/gmail_token.json"
          echo "GMAIL_TOKEN_FILE=$RUNNER_TEMP/gmail_token.json" >> "$GITHUB_ENV"

      - name: Run pipeline
        run: python main.py

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grants-run-${{ github.run_id }}
          path: |
            grants_data/grants_csv_data/*.csv
            logs/grantwatch.log
          if-no-files-found: ignore
          retention-days: 14
