# EXAMPLE ONLY: real values are rendered from ansible-vault at deploy time
# (ansible/roles/grantwatch). Do not commit real credentials. `kubectl apply`
# of this file is for local/dev only.
apiVersion: v1
kind: Secret
metadata:
  name: grantwatch-cred
  namespace: grantwatch
type: Opaque
stringData:
  GRANTS_LLM_BASE_URL: "http://open-webui-host:port/api"
  GRANTS_LLM_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_URL: "postgresql://grantwatch:REPLACE_ME@grantwatch-db.grantwatch.svc:5432/grantwatch"
  GRANTS_SECRET_KEY: "REPLACE_ME_WITH_32_RANDOM_CHARACTERS"
  GRANTS_DASHBOARD_URL: "http://node-ip:30810"
  GRANTS_ADMIN_PASSWORD: "REPLACE_ME"   # the /admin/ status page; 16+ ASCII letters and digits; used nowhere else
  # Optional. Without recipients the daily job only ingests and scores.
  # GRANTS_NOTIFY_RECIPIENTS: "you@example.org"
  # GRANTS_EMAIL_FROM: "GrantWatch <alerts@example.org>"
  # GRANTS_SMTP_HOST: "smtp.gmail.com"
  # GRANTS_SMTP_USER: "alerts@example.org"
  # GRANTS_SMTP_PASSWORD: "app-password"
---
# The research profile, mounted over config/research_profile.local.yml.
apiVersion: v1
kind: Secret
metadata:
  name: grantwatch-profile
  namespace: grantwatch
type: Opaque
stringData:
  research_profile.local.yml: |
    summary: >
      REPLACE ME. Two to five sentences on the group's research.
    institution: University of North Dakota
    applicant_type: public university
    keywords: [cybersecurity, machine learning, power grid]
    keyword_threshold: 1
    min_score_to_notify: 4
