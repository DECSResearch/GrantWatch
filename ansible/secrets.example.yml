# Copy to ansible/secrets.yml, fill it in, then encrypt it:
#   ansible-vault encrypt ansible/secrets.yml
# secrets.yml is git-ignored either way. The deploy renders these values into
# the grantwatch-cred Secret.

llm_base_url: "http://open-webui-host:port/api"   # Open WebUI's OpenAI-compatible API
llm_api_key: "REPLACE_ME"                          # Open WebUI: Settings > Account > API keys
db_password: "REPLACE_ME"                          # letters and digits, e.g. openssl rand -hex 24
secret_key: "REPLACE_ME"                           # signs dashboard sign-in links; openssl rand -hex 32

# Optional email. Without recipients the daily job only ingests and scores,
# and the dashboard still shows the recommendations.
# notify_recipients: "you@example.org,colleague@example.org"
# email_from: "GrantWatch <alerts@example.org>"
# smtp_host: "smtp.gmail.com"
# smtp_user: "alerts@example.org"
# smtp_password: "app-password"
